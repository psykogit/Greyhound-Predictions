services:
  greyhound-engine:
    build: .
    container_name: greyhound_engine
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Mount the entire codebase so edits/git pulls are immediately live
      - ./:/app
      # Keep the container's bytecode cache separate from host
      - /app/__pycache__
      # Mount the database file so it persists securely across container rebuilds/restarts
      - ./greyhound_racing.db:/app/greyhound_racing.db
    environment:
      - TZ=Australia/Perth
